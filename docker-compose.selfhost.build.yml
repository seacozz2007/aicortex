# Development override: build the backend/web images from the current checkout
# instead of pulling the official GHCR images.
#
# Image tag defaults to git describe (same as `aicortex version`), via
# AICORTEX_BUILD_TAG from the Makefile / ENV_FILE.

services:
  backend:
    image: aicortex-backend:${AICORTEX_BUILD_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${AICORTEX_BUILD_TAG:-dev}
        COMMIT: ${COMMIT:-unknown}

  frontend:
    image: aicortex-web:${AICORTEX_BUILD_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        REMOTE_API_URL: ${REMOTE_API_URL:-http://backend:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_VERSION: ${AICORTEX_BUILD_TAG:-dev}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        # For Chinese users: set to https://registry.npmmirror.com in a .env file
        NPM_REGISTRY_MIRROR: ${NPM_REGISTRY_MIRROR:-}
